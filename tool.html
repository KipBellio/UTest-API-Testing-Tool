<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/tool.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
</head>

<body>
    <header id="header">
        <h1 id="UTest">UTest | <span>API Testing Tool</span></h1>
        <nav class="nav-items">
            <a href="index.html">Home-></a>
        </nav>
    </header>
    <main class="main">
       <h1 id="test">Test APIs. <br> <span id="span">Understand responses.</span></h1>
       <h2 id="request">Request</h2>
       <form class="form" action="POST">
        <div id="input">
            <select name="method" id="method" required>
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="PATCH">PATCH</option>
                <option value="DELETE">DELETE</option> 
            </select>
            <input type="text" placeholder="Enter API URL..." id="url">
        </div>
        <h3 id="RB">Request body: Optional</h3>
        <div id="request-container">
            <textarea id="json" placeholder="Enter JSON body here..." rows="8"></textarea>
        </div>
        <button id="sendr">Send request</button>
       </form>
       <div>
       <h3 id="rpanel">Response panel</h3>
       <h4 id="rbody">Response body</h4>
       <p id="status">Status:</p>
       </div>
       <pre id="response-display" class="response-body"></pre>
       <div>
        <h3 id="rhistory">Request history </h3>
       </div>
       <div class="response-history"></div>
    </main>
    <footer id="footer">
        <div id="Copyright">
                Copyright @2026 | UTest API Tool | Roben Duncan
            </div>
    </footer>
    <script type="module" src="js/tool.js"></script>
</body>

</html>
